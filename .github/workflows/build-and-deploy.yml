name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'research/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: kristianwindsor
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            kristianwindsor/isaakstory.org:b${{ github.run_number }}
            kristianwindsor/isaakstory.org:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl set image deployment/isaakstory isaakstory=kristianwindsor/isaakstory.org:b${{ github.run_number }}
          kubectl rollout status deployment/isaakstory
